! ============================================================
! DEVICE 1 — ACCESS LAYER SWITCH
! Role: Connects end-user devices (PCs, IP Phones, APs)
! ============================================================

! --- GLOBAL SETTINGS ---
hostname <ACCESS-SWITCH-HOSTNAME>
enable secret <ENABLE_PASSWORD>
service timestamps log datetime msec
service password-encryption
ip domain-name <YOUR_DOMAIN>

! --- VLAN DATABASE ---
vlan <DATA_VLAN_ID>
 name <DATA_VLAN_NAME>
vlan <VOICE_VLAN_ID>
 name <VOICE_VLAN_NAME>
vlan <MGMT_VLAN_ID>
 name MANAGEMENT

! --- ACCESS PORT (PC + IP Phone) ---
! Repeat this block for each access port as needed
interface <ACCESS_PORT_ID>
 description <PORT_DESCRIPTION>
 switchport mode access
 switchport access vlan <DATA_VLAN_ID>
 switchport voice vlan <VOICE_VLAN_ID>
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown

! --- UPLINK TO DISTRIBUTION (TRUNK) ---
interface <UPLINK_PORT_ID>
 description UPLINK_TO_<DISTRIBUTION_SWITCH_NAME>
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan <DATA_VLAN_ID>,<VOICE_VLAN_ID>,<MGMT_VLAN_ID>
 no shutdown

! --- MANAGEMENT INTERFACE ---
interface Vlan<MGMT_VLAN_ID>
 description MANAGEMENT_SVI
 ip address <MGMT_IP_ADDRESS> <SUBNET_MASK>
 no shutdown

! --- DEFAULT GATEWAY ---
ip default-gateway <DEFAULT_GATEWAY_IP>

! --- REMOTE ACCESS (SSH/VTY) ---
line vty 0 15
 transport input ssh
 login local
 exec-timeout 10 0

! --- NTP ---
ntp server <NTP_SERVER_IP>

! --- SNMP (OPTIONAL) ---
snmp-server community <COMMUNITY_STRING> RO
snmp-server location <LOCATION>
snmp-server contact <CONTACT_EMAIL>


! ============================================================
! DEVICE 2 — CORE / DISTRIBUTION LAYER SWITCH
! Role: Inter-VLAN routing, default gateway, DHCP server
! ============================================================

! --- GLOBAL SETTINGS ---
hostname <CORE-SWITCH-HOSTNAME>
enable secret <ENABLE_PASSWORD>
ip routing
service timestamps log datetime msec
service password-encryption

! --- VLAN DATABASE ---
vlan <DATA_VLAN_ID>
 name <DATA_VLAN_NAME>
vlan <VOICE_VLAN_ID>
 name <VOICE_VLAN_NAME>
vlan <MGMT_VLAN_ID>
 name MANAGEMENT

! --- LAYER 3 VLAN INTERFACES (GATEWAYS) ---
interface Vlan<DATA_VLAN_ID>
 description DATA_GATEWAY
 ip address <DATA_GATEWAY_IP> <SUBNET_MASK>
 ip helper-address <DHCP_SERVER_IP>
 no shutdown

interface Vlan<VOICE_VLAN_ID>
 description VOICE_GATEWAY
 ip address <VOICE_GATEWAY_IP> <SUBNET_MASK>
 no shutdown

interface Vlan<MGMT_VLAN_ID>
 description MANAGEMENT_GATEWAY
 ip address <MGMT_GATEWAY_IP> <SUBNET_MASK>
 no shutdown

! --- DHCP POOLS ---
ip dhcp excluded-address <DATA_GATEWAY_IP> <RESERVED_END_IP>
ip dhcp pool <DATA_POOL_NAME>
 network <DATA_NETWORK> <SUBNET_MASK>
 default-router <DATA_GATEWAY_IP>
 dns-server <DNS_SERVER_IP>
 lease 1

ip dhcp excluded-address <VOICE_GATEWAY_IP>
ip dhcp pool <VOICE_POOL_NAME>
 network <VOICE_NETWORK> <SUBNET_MASK>
 default-router <VOICE_GATEWAY_IP>
 option 150 ip <CUCM_SERVER_IP>
 lease 1

! --- DOWNLINK TO ACCESS SWITCH (TRUNK) ---
interface <DOWNLINK_PORT_ID>
 description DOWNLINK_TO_<ACCESS_SWITCH_NAME>
 switchport mode trunk
 switchport trunk native vlan 1
 switchport trunk allowed vlan <DATA_VLAN_ID>,<VOICE_VLAN_ID>,<MGMT_VLAN_ID>
 no shutdown

! --- ROUTING (OPTIONAL — ADD IF CONNECTING TO WAN/CORE) ---
! router ospf <PROCESS_ID>
!  router-id <ROUTER_ID>
!  network <NETWORK> <WILDCARD> area <AREA_ID>

! --- STATIC DEFAULT ROUTE (IF NO DYNAMIC ROUTING) ---
! ip route 0.0.0.0 0.0.0.0 <NEXT_HOP_IP>

! --- REMOTE ACCESS (SSH/VTY) ---
line vty 0 15
 transport input ssh
 login local
 exec-timeout 10 0

! --- NTP ---
ntp server <NTP_SERVER_IP>

